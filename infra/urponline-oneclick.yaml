AWSTemplateFormatVersion: '2010-09-09'
Description: URPOnline - Despliegue base ALB ASG RDS Redis S3. Artefacto .NET publicado previamente en S3.
Parameters:
  ArtifactBucket:
    Type: String
    Description: Bucket EXISTENTE con el ZIP publicado (no ZIP de fuentes), en esta región
  ArtifactKey:
    Type: String
    Default: releases/urponline-publish.zip
    Description: Clave de ZIP con TiendaOnline.dll en la raiz
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Use a secret; never hardcode password in this file
  KeyPair:
    Type: String
    Default: ''
    Description: Optional; recommended SSM Session Manager instead of SSH
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small,t3.medium,t3.large]
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  AppDesired:
    Type: Number
    Default: 2
  AppMax:
    Type: Number
    Default: 4
  DBBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35
    Description: Días de respaldo automático de RDS (cuentas del plan gratuito de AWS admiten como máximo 1; con 0 se desactiva)
  EnableMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues: ['true','false']
  EnableReadReplica:
    Type: String
    Default: 'false'
    AllowedValues: ['true','false']
    Description: Fase 3 (B3) - replica de lectura de RDS para el catalogo. Cobra por hora como otra instancia; exige DBBackupRetentionDays mayor que 0.
  AgentesBusName:
    Type: String
    Default: ''
    Description: Bus de EventBridge de la capa de agentes (Output BusName de infra/fase2-agentes.yaml). Vacio = la tienda no publica eventos.
  LlmSecretName:
    Type: String
    Default: urponline/llm
    Description: Secreto de Secrets Manager con las API keys de los modelos (lo crea y lo edita /admin/modelos).
  SecurityEmail:
    Type: String
    Default: ''
    Description: Correo que recibe las alertas de seguridad (intrusion, CPU alta). Vacio = sin suscripcion.
Conditions:
  HayCorreoSeguridad: !Not [!Equals [!Ref SecurityEmail, '']]
  MultiAZ: !Equals [!Ref EnableMultiAZ,'true']
  ConReplica: !Equals [!Ref EnableReadReplica,'true']
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.0.0.0/16,EnableDnsHostnames: true,EnableDnsSupport: true,Tags: [{Key: Name,Value: URPOnline-VPC}]}
  IGW: {Type: AWS::EC2::InternetGateway}
  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC,InternetGatewayId: !Ref IGW}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC,CidrBlock: 10.0.1.0/24,AvailabilityZone: !Select [0,!GetAZs ''],MapPublicIpOnLaunch: true}
  PublicB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC,CidrBlock: 10.0.2.0/24,AvailabilityZone: !Select [1,!GetAZs ''],MapPublicIpOnLaunch: true}
  AppA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC,CidrBlock: 10.0.11.0/24,AvailabilityZone: !Select [0,!GetAZs '']}
  AppB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC,CidrBlock: 10.0.12.0/24,AvailabilityZone: !Select [1,!GetAZs '']}
  DataA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC,CidrBlock: 10.0.21.0/24,AvailabilityZone: !Select [0,!GetAZs '']}
  DataB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref VPC,CidrBlock: 10.0.22.0/24,AvailabilityZone: !Select [1,!GetAZs '']}
  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties: {RouteTableId: !Ref PublicRT,DestinationCidrBlock: 0.0.0.0/0,GatewayId: !Ref IGW}
  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicA,RouteTableId: !Ref PublicRT}
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicB,RouteTableId: !Ref PublicRT}
  EipA: {Type: AWS::EC2::EIP,Properties: {Domain: vpc}}
  EipB: {Type: AWS::EC2::EIP,Properties: {Domain: vpc}}
  NatA:
    Type: AWS::EC2::NatGateway
    DependsOn: AttachIGW
    Properties: {AllocationId: !GetAtt EipA.AllocationId,SubnetId: !Ref PublicA}
  NatB:
    Type: AWS::EC2::NatGateway
    DependsOn: AttachIGW
    Properties: {AllocationId: !GetAtt EipB.AllocationId,SubnetId: !Ref PublicB}
  AppRTA: {Type: AWS::EC2::RouteTable,Properties: {VpcId: !Ref VPC}}
  AppRTB: {Type: AWS::EC2::RouteTable,Properties: {VpcId: !Ref VPC}}
  AppRouteA:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref AppRTA,DestinationCidrBlock: 0.0.0.0/0,NatGatewayId: !Ref NatA}
  AppRouteB:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref AppRTB,DestinationCidrBlock: 0.0.0.0/0,NatGatewayId: !Ref NatB}
  AssocAppA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppA,RouteTableId: !Ref AppRTA}
  AssocAppB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppB,RouteTableId: !Ref AppRTB}
  DataRT: {Type: AWS::EC2::RouteTable,Properties: {VpcId: !Ref VPC}}
  # VPC endpoint de S3 (tipo Gateway, gratis): las EC2 privadas llegan a S3 (ZIP, CSV de proveedores,
  # repositorios de Amazon Linux) por la red interna de AWS, sin pasar por el NAT ni por Internet.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRTA, !Ref AppRTB]
  # NACL de la subred de datos: segunda barrera (además de los security groups).
  # Solo entra PostgreSQL (5432) y Redis (6379) desde las subredes de aplicación; todo lo demás se rechaza.
  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: URPOnline-datos}]
  DataNaclInPgA:    {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.11.0/24, PortRange: {From: 5432, To: 5432}}}
  DataNaclInPgB:    {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.12.0/24, PortRange: {From: 5432, To: 5432}}}
  DataNaclInRedisA: {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.11.0/24, PortRange: {From: 6379, To: 6379}}}
  DataNaclInRedisB: {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 111, Protocol: 6, RuleAction: allow, Egress: false, CidrBlock: 10.0.12.0/24, PortRange: {From: 6379, To: 6379}}}
  DataNaclInDatosA: {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 120, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: 10.0.21.0/24}}
  DataNaclInDatosB: {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 121, Protocol: -1, RuleAction: allow, Egress: false, CidrBlock: 10.0.22.0/24}}
  DataNaclOutAppA:  {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.0.11.0/24, PortRange: {From: 1024, To: 65535}}}
  DataNaclOutAppB:  {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 101, Protocol: 6, RuleAction: allow, Egress: true, CidrBlock: 10.0.12.0/24, PortRange: {From: 1024, To: 65535}}}
  DataNaclOutDatosA: {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 120, Protocol: -1, RuleAction: allow, Egress: true, CidrBlock: 10.0.21.0/24}}
  DataNaclOutDatosB: {Type: AWS::EC2::NetworkAclEntry, Properties: {NetworkAclId: !Ref DataNacl, RuleNumber: 121, Protocol: -1, RuleAction: allow, Egress: true, CidrBlock: 10.0.22.0/24}}
  DataNaclAssocA: {Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: {SubnetId: !Ref DataA, NetworkAclId: !Ref DataNacl}}
  DataNaclAssocB: {Type: AWS::EC2::SubnetNetworkAclAssociation, Properties: {SubnetId: !Ref DataB, NetworkAclId: !Ref DataNacl}}
  DataAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataA,RouteTableId: !Ref DataRT}
  DataAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataB,RouteTableId: !Ref DataRT}
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: URPOnline ALB public HTTP - add ACM HTTPS for production
      VpcId: !Ref VPC
      SecurityGroupIngress: [{IpProtocol: tcp,FromPort: 80,ToPort: 80,CidrIp: 0.0.0.0/0}]
  AppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: URPOnline apps from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress: [{IpProtocol: tcp,FromPort: 80,ToPort: 80,SourceSecurityGroupId: !Ref AlbSG}]
      # Salida MINIMA: solo HTTPS (AWS, modelos, paquetes). RDS y Redis en AppEgressPostgres/AppEgressRedis.
      # Una conexion a otro puerto (p. ej. un minero a :3333) queda BLOQUEADA y registrada en los Flow Logs.
      SecurityGroupEgress: [{IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}]
  DbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from App for initial lab - switch to PgBouncer SG in advanced topology
      VpcId: !Ref VPC
      SecurityGroupIngress: [{IpProtocol: tcp,FromPort: 5432,ToPort: 5432,SourceSecurityGroupId: !Ref AppSG}]
  RedisSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis from application
      VpcId: !Ref VPC
      SecurityGroupIngress: [{IpProtocol: tcp,FromPort: 6379,ToPort: 6379,SourceSecurityGroupId: !Ref AppSG}]
  DBSubnet:
    Type: AWS::RDS::DBSubnetGroup
    Properties: {DBSubnetGroupDescription: URPOnline data,SubnetIds: [!Ref DataA,!Ref DataB]}
  Postgres:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '16'   # PostgreSQL 16 en RDS incluye la extensión pgvector
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      DBName: urponline
      MasterUsername: urponline
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnet
      VPCSecurityGroups: [!Ref DbSG]
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref DBBackupRetentionDays
      MultiAZ: !If [MultiAZ,true,false]
      StorageEncrypted: true
  # Fase 3 (B3) - Balanceo en la base de datos: replica de lectura asincrona del primario, en la otra zona.
  # El catalogo y la busqueda leen de aqui (ConnectionStrings__PostgresLectura en k8s/deployment.yaml);
  # los pedidos y pagos escriben en el primario. Hereda el cifrado, el grupo de subredes y el usuario del primario.
  # B6 sin Multi-AZ: aws rds promote-read-replica la convierte en primario independiente (no se puede deshacer).
  ReplicaLectura:
    Type: AWS::RDS::DBInstance
    Condition: ConReplica
    DeletionPolicy: Delete
    Properties:
      SourceDBInstanceIdentifier: !Ref Postgres
      DBInstanceClass: !Ref DBInstanceClass
      AvailabilityZone: !Select [1, !GetAZs '']
      VPCSecurityGroups: [!Ref DbSG]
      PubliclyAccessible: false
  # AWS Secrets Manager: guarda usuario y contraseña de RDS. La app lo lee al arrancar con el AWS SDK
  # (GetSecretValue); la contraseña ya no se escribe en /etc/urponline.env de la EC2.
  # Claves de acceso a /admin (modelos, promociones, compras) y a /Analytics. Las GENERA Secrets Manager:
  # no se escriben en el YAML ni en el repositorio. La EC2 las lee al arrancar (ver UserData).
  AccesosSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/accesos'
      Description: Claves de /admin y /Analytics de URPOnline (generadas)
      GenerateSecretString:
        SecretStringTemplate: '{"usuario":"urponline"}'
        GenerateStringKey: admin
        PasswordLength: 24
        ExcludePunctuation: true
  DashboardSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/dashboard'
      Description: Clave de /Analytics de URPOnline (generada)
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/rds-postgres'
      Description: Credenciales de RDS PostgreSQL de URPOnline (las lee la app con el AWS SDK)
      SecretString: !Sub '{"username":"urponline","password":"${DBPassword}"}'
  RedisSubnet:
    Type: AWS::ElastiCache::SubnetGroup
    Properties: {Description: URPOnline data subnets,SubnetIds: [!Ref DataA,!Ref DataB]}
  Redis:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: URPOnline Redis session store
      Engine: redis
      CacheNodeType: cache.t3.micro
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref RedisSubnet
      SecurityGroupIds: [!Ref RedisSG]
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
  SupplierBucket:
    Type: AWS::S3::Bucket
    Properties: {PublicAccessBlockConfiguration: {BlockPublicAcls: true,BlockPublicPolicy: true,IgnorePublicAcls: true,RestrictPublicBuckets: true},VersioningConfiguration: {Status: Enabled}}
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17',Statement: [{Effect: Allow,Principal: {Service: ec2.amazonaws.com},Action: 'sts:AssumeRole'}]}
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore', 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy']
      Policies:
        - PolicyName: URPOnlineS3Read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject','s3:ListBucket']
                Resource: [!GetAtt SupplierBucket.Arn, !Sub '${SupplierBucket.Arn}/*']
              - Effect: Allow
                Action: ['s3:GetObject']
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactKey}'
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue']
                Resource: [!Ref DbSecret, !Ref AccesosSecret, !Ref DashboardSecret]
              # /admin/modelos guarda y lee las API keys de los modelos en su propio secreto.
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue','secretsmanager:PutSecretValue','secretsmanager:CreateSecret']
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${LlmSecretName}*'
              # La tienda publica sus eventos de negocio (CompraCancelada, PedidoCreado...) en el bus de los agentes.
              - Effect: Allow
                Action: ['events:PutEvents']
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/urponline-*'
  # VPC Flow Logs: registra el tráfico aceptado y rechazado de toda la VPC en CloudWatch Logs.
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/urponline/${AWS::StackName}/vpc-flow-logs', RetentionInDays: 3}
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: vpc-flow-logs.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      Policies:
        - PolicyName: EscribirFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogGroups', 'logs:DescribeLogStreams']
                Resource: !GetAtt FlowLogGroup.Arn
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/urponline/${AWS::StackName}/app', RetentionInDays: 7}
  NginxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/urponline/${AWS::StackName}/nginx-access', RetentionInDays: 7}
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref AppRole]}
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties: {Type: application,Scheme: internet-facing,Subnets: [!Ref PublicA,!Ref PublicB],SecurityGroups: [!Ref AlbSG]}
  TG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties: {VpcId: !Ref VPC,Port: 80,Protocol: HTTP,TargetType: instance,HealthCheckPath: /health}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties: {LoadBalancerArn: !Ref ALB,Port: 80,Protocol: HTTP,DefaultActions: [{Type: forward,TargetGroupArn: !Ref TG}]}
  # HTTPS sin dominio propio: CloudFront entrega https://xxxx.cloudfront.net con el certificado de AWS
  # y reenvía al ALB por HTTP. (Con dominio propio: certificado ACM + listener 443 en el ALB + Route 53.)
  CDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: URPOnline - HTTPS delante del ALB
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig: {OriginProtocolPolicy: http-only, HTTPPort: 80}
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled (carrito y precios siempre al día)
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer (cookies, query string y encabezados)
        CacheBehaviors:
          - PathPattern: /css/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6      # Managed-CachingOptimized
          - PathPattern: /js/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
  Launch:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        # IMDSv2 obligatorio: el rol de la instancia solo se obtiene con token de sesion (frena el robo por SSRF).
        MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1, HttpEndpoint: enabled}
        SecurityGroupIds: [!Ref AppSG]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y aws-cfn-bootstrap
            # Si algo falla, avisa a CloudFormation para que el despliegue se marque como fallido (y haga rollback).
            trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource Scaling --region ${AWS::Region}' ERR
            dnf install -y nginx unzip amazon-cloudwatch-agent aspnetcore-runtime-8.0
            mkdir -p /opt/urponline
            aws s3 cp s3://${ArtifactBucket}/${ArtifactKey} /tmp/urp.zip
            unzip -oq /tmp/urp.zip -d /opt/urponline || [ $? -eq 1 ]   # 1 = solo advertencia (ZIP hecho en Windows); el test siguiente valida
            test -f /opt/urponline/TiendaOnline.dll
            chown -R nginx:nginx /opt/urponline
            cat >/etc/urponline.env <<'ENV'
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://127.0.0.1:8080
            ConnectionStrings__Postgres=Host=${Postgres.Endpoint.Address};Port=5432;Database=urponline;Username=urponline;SSL Mode=Require;Trust Server Certificate=true
            # Sin contraseña: la app la pide a Secrets Manager con el AWS SDK.
            Database__SecretArn=${DbSecret}
            ConnectionStrings__Redis=${Redis.PrimaryEndPoint.Address}:6379,ssl=true,abortConnect=false
            # Aplica las migraciones EF Core (tablas + pgvector + índice HNSW) al arrancar; un bloqueo en PostgreSQL evita que 2 EC2 migren a la vez.
            InitializeDatabase=true
            # La app publica sus métricas de negocio (pedidos, ventas) en CloudWatch con el AWS SDK.
            Metrics__CloudWatchEnabled=true
            AWS__Region=${AWS::Region}
            # Fase 2: bus de EventBridge de los agentes (vacio = solo se escriben en el log) y secreto de los modelos.
            Events__BusName=${AgentesBusName}
            Llm__SecretId=${LlmSecretName}
            ENV
            # Claves de /admin y /Analytics: se leen de Secrets Manager (no estan en el YAML ni en el ZIP).
            echo "Admin__AccessKey=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${AccesosSecret} --query SecretString --output text | python3 -c 'import sys,json; print(json.load(sys.stdin)["admin"])')" >> /etc/urponline.env
            echo "Dashboard__AccessKey=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${DashboardSecret} --query SecretString --output text)" >> /etc/urponline.env
            grep -q '^Admin__AccessKey=.\+' /etc/urponline.env
            chmod 600 /etc/urponline.env
            mkdir -p /var/log/urponline && chown nginx:nginx /var/log/urponline
            cat >/etc/systemd/system/urponline.service <<'SYSTEMD'
            [Unit]
            Description=URPOnline ASP.NET Core
            After=network-online.target
            Wants=network-online.target
            [Service]
            WorkingDirectory=/opt/urponline
            EnvironmentFile=/etc/urponline.env
            ExecStart=/usr/bin/dotnet /opt/urponline/TiendaOnline.dll
            Restart=always
            StandardOutput=append:/var/log/urponline/app.log
            StandardError=append:/var/log/urponline/app.log
            RestartSec=5
            User=nginx
            Group=nginx
            NoNewPrivileges=true
            [Install]
            WantedBy=multi-user.target
            SYSTEMD
            cat >/etc/nginx/nginx.conf <<'NGINX'
            user nginx;
            worker_processes auto;
            error_log /var/log/nginx/error.log warn;
            pid /run/nginx.pid;
            events { worker_connections 1024; }
            http {
             include /etc/nginx/mime.types;
             default_type application/octet-stream;
             access_log /var/log/nginx/access.log;
             server {
              listen 80 default_server;
              server_name _;
              location / {
                proxy_pass http://127.0.0.1:8080;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
                proxy_set_header X-Forwarded-Host $host;
              }
             }
            }
            NGINX
            rm -f /etc/nginx/conf.d/default.conf
            systemctl daemon-reload
            systemctl enable --now urponline
            systemctl enable --now nginx
            # Agente de CloudWatch: logs de la tienda y de Nginx (un log stream por EC2) + memoria y disco.
            cat >/opt/aws/amazon-cloudwatch-agent/etc/urponline.json <<'CWA'
            {"logs":{"logs_collected":{"files":{"collect_list":[
              {"file_path":"/var/log/urponline/app.log","log_group_name":"${AppLogGroup}","log_stream_name":"{instance_id}"},
              {"file_path":"/var/log/nginx/access.log","log_group_name":"${NginxLogGroup}","log_stream_name":"{instance_id}"}]}}},
             "metrics":{"namespace":"URPOnline/EC2","append_dimensions":{"AutoScalingGroupName":"${!aws:AutoScalingGroupName}"},
              "aggregation_dimensions":[["AutoScalingGroupName"]],
              "metrics_collected":{"mem":{"measurement":["mem_used_percent"]},"disk":{"measurement":["used_percent"],"resources":["/"]}}}}
            CWA
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/urponline.json
            curl --retry 20 --retry-delay 3 --retry-connrefused --fail http://127.0.0.1:8080/health
            # La tienda responde: avisa a CloudFormation que esta EC2 está lista.
            /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource Scaling --region ${AWS::Region}
  Scaling:
    Type: AWS::AutoScaling::AutoScalingGroup
    # La pila espera a que cada EC2 confirme que la tienda arrancó (cfn-signal).
    CreationPolicy:
      ResourceSignal: {Count: !Ref AppDesired, Timeout: PT25M}
    # Cada versión nueva (ArtifactKey distinto) reemplaza las EC2 de una en una: la tienda no se cae.
    UpdatePolicy:
      AutoScalingRollingUpdate: {MinInstancesInService: 1, MaxBatchSize: 1, PauseTime: PT25M, WaitOnResourceSignals: true}
    Properties:
      VPCZoneIdentifier: [!Ref AppA,!Ref AppB]
      MinSize: '2'
      MaxSize: !Ref AppMax
      DesiredCapacity: !Ref AppDesired
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs: [!Ref TG]
      LaunchTemplate: {LaunchTemplateId: !Ref Launch,Version: !GetAtt Launch.LatestVersionNumber}
  # Alarmas: se ponen en rojo si una EC2 deja de responder al ALB o si la tienda devuelve errores 5xx.
  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-EC2-no-saludables'
      AlarmDescription: Hay EC2 detrás del ALB que no responden /health
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt ALB.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt TG.TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  Errors5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-errores-5xx'
      AlarmDescription: La tienda devolvió más de 5 errores 5xx en 5 minutos
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt ALB.LoadBalancerFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  # Telemetría en UNA sola pantalla: CloudWatch -> Dashboards -> URPOnline-<pila> (link en Outputs).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'URPOnline-${AWS::StackName}'
      DashboardBody: !Sub |
        {
          "start": "-PT3H",
          "periodOverride": "inherit",
          "widgets": [
            {"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"# URPOnline en AWS: telemetría de todos los servicios\nTienda (HTTPS): https://${CDN.DomainName}  |  Navega, busca y compra: en 1-2 min suben las gráficas. Termina una EC2 en la consola y mira cómo Auto Scaling la reemplaza."}},
            {"type":"alarm","x":0,"y":2,"width":24,"height":2,"properties":{"title":"Alarmas","alarms":["${UnhealthyHostsAlarm.Arn}","${Errors5xxAlarm.Arn}"]}},
            {"type":"metric","x":0,"y":4,"width":8,"height":6,"properties":{"title":"ALB: peticiones y errores 5xx","region":"${AWS::Region}","stat":"Sum","period":60,"view":"timeSeries","metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${ALB.LoadBalancerFullName}",{"label":"Peticiones"}],[".","HTTPCode_Target_5XX_Count",".",".",{"label":"Errores 5xx","color":"#d62728"}]]}},
            {"type":"metric","x":8,"y":4,"width":8,"height":6,"properties":{"title":"ALB: EC2 sanas detrás del balanceador","region":"${AWS::Region}","stat":"Maximum","period":60,"view":"timeSeries","metrics":[["AWS/ApplicationELB","HealthyHostCount","TargetGroup","${TG.TargetGroupFullName}","LoadBalancer","${ALB.LoadBalancerFullName}",{"label":"Sanas","color":"#2ca02c"}],[".","UnHealthyHostCount",".",".",".",".",{"label":"No sanas","color":"#d62728"}]],"yAxis":{"left":{"min":0}}}},
            {"type":"metric","x":16,"y":4,"width":8,"height":6,"properties":{"title":"ALB: tiempo de respuesta (s)","region":"${AWS::Region}","stat":"Average","period":60,"view":"timeSeries","metrics":[["AWS/ApplicationELB","TargetResponseTime","LoadBalancer","${ALB.LoadBalancerFullName}",{"label":"Promedio"}],["...",{"stat":"p95","label":"p95"}]]}},
            {"type":"metric","x":0,"y":10,"width":8,"height":6,"properties":{"title":"EC2 (Auto Scaling): CPU % y memoria %","region":"${AWS::Region}","period":60,"view":"timeSeries","metrics":[["AWS/EC2","CPUUtilization","AutoScalingGroupName","${Scaling}",{"stat":"Average","label":"CPU %"}],["URPOnline/EC2","mem_used_percent","AutoScalingGroupName","${Scaling}",{"stat":"Average","label":"Memoria %"}]],"yAxis":{"left":{"min":0,"max":100}}}},
            {"type":"metric","x":8,"y":10,"width":8,"height":6,"properties":{"title":"RDS PostgreSQL: conexiones y CPU %","region":"${AWS::Region}","period":60,"view":"timeSeries","metrics":[["AWS/RDS","DatabaseConnections","DBInstanceIdentifier","${Postgres}",{"stat":"Maximum","label":"Conexiones"}],[".","CPUUtilization",".",".",{"stat":"Average","label":"CPU %","yAxis":"right"}]]}},
            {"type":"metric","x":16,"y":10,"width":8,"height":6,"properties":{"title":"ElastiCache Redis (sesiones): conexiones y memoria %","region":"${AWS::Region}","period":60,"view":"timeSeries","metrics":[[{"expression":"SEARCH('{AWS/ElastiCache,CacheClusterId} MetricName=\"CurrConnections\" ${Redis}', 'Maximum', 60)","id":"conn","label":"Conexiones"}],[{"expression":"SEARCH('{AWS/ElastiCache,CacheClusterId} MetricName=\"DatabaseMemoryUsagePercentage\" ${Redis}', 'Average', 60)","id":"mem","label":"Memoria %","yAxis":"right"}]]}},
            {"type":"metric","x":0,"y":16,"width":8,"height":6,"properties":{"title":"Tienda (AWS SDK): pedidos y ventas S/","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[["URPOnline","OrdersCreated",{"label":"Pedidos"}],[".","OrderAmount",{"label":"Ventas S/","yAxis":"right"}]]}},
            {"type":"metric","x":8,"y":16,"width":8,"height":6,"properties":{"title":"CloudFront (HTTPS): peticiones y % de errores","region":"us-east-1","period":300,"view":"timeSeries","metrics":[["AWS/CloudFront","Requests","Region","Global","DistributionId","${CDN}",{"stat":"Sum","label":"Peticiones"}],[".","5xxErrorRate",".",".",".",".",{"stat":"Average","label":"% 5xx","yAxis":"right"}]]}},
            {"type":"metric","x":16,"y":16,"width":8,"height":6,"properties":{"title":"EC2: disco usado %","region":"${AWS::Region}","stat":"Average","period":300,"view":"timeSeries","metrics":[["URPOnline/EC2","disk_used_percent","AutoScalingGroupName","${Scaling}",{"label":"Disco %"}]],"yAxis":{"left":{"min":0,"max":100}}}},
            {"type":"log","x":0,"y":22,"width":24,"height":7,"properties":{"title":"Logs de la tienda (cada logStream = una EC2)","region":"${AWS::Region}","view":"table","query":"SOURCE '${AppLogGroup}' | fields @timestamp, @logStream as EC2, @message | sort @timestamp desc | limit 50"}},
            {"type":"log","x":0,"y":35,"width":24,"height":6,"properties":{"title":"VPC Flow Logs: tráfico RECHAZADO por security groups / NACL (intentos bloqueados)","region":"${AWS::Region}","view":"table","query":"SOURCE '${FlowLogGroup}' | filter action = 'REJECT' | stats count(*) as intentos by srcAddr, dstAddr, dstPort | sort intentos desc | limit 20"}},
            {"type":"log","x":0,"y":29,"width":24,"height":6,"properties":{"title":"Nginx: peticiones por EC2 (el ALB reparte)","region":"${AWS::Region}","view":"bar","query":"SOURCE '${NginxLogGroup}' | stats count(*) as peticiones by @logStream as EC2"}}
          ]
        }
  # ===================== DEFENSA PROACTIVA (fase 2, categoria 3) =====================
  # Grupo de CUARENTENA: sin entrada y sin salida. La respuesta automatica mueve aqui la instancia comprometida.
  CuarentenaSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: URPOnline cuarentena - instancia aislada por la respuesta automatica (sin trafico)
      VpcId: !Ref VPC
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 127.0.0.1/32}]   # reemplaza la salida por defecto: nada sale
  # Salida MINIMA de la aplicacion (ademas del HTTPS de AppSG): solo a RDS y a Redis.
  AppEgressPostgres:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSG, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DbSG}
  AppEgressRedis:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AppSG, IpProtocol: tcp, FromPort: 6379, ToPort: 6379, DestinationSecurityGroupId: !Ref RedisSG}

  SeguridadTopic:
    Type: AWS::SNS::Topic
    Properties: {TopicName: !Sub '${AWS::StackName}-seguridad'}
  SeguridadSuscripcion:
    Type: AWS::SNS::Subscription
    Condition: HayCorreoSeguridad
    Properties: {TopicArn: !Ref SeguridadTopic, Protocol: email, Endpoint: !Ref SecurityEmail}

  # DETECCION: los VPC Flow Logs registran cada intento de salida (aceptado o rechazado). Se cuenta como
  # conexion sospechosa la que va a puertos tipicos de mineria / tuneles o a la red reservada 203.0.113.0/24.
  FiltroPuertosSospechosos:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FlowLogGroup
      FilterPattern: '[version, account, eni, source, destination, srcport, destport=3333 || destport=4444 || destport=5555 || destport=14444 || destport=51820, protocol, packets, bytes, start, end, action, status]'
      MetricTransformations: [{MetricNamespace: URPOnline/Seguridad, MetricName: ConexionSospechosa, MetricValue: '1', DefaultValue: 0}]
  FiltroRedSospechosa:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref FlowLogGroup
      FilterPattern: '[version, account, eni, source, destination="203.0.113.*", srcport, destport, protocol, packets, bytes, start, end, action, status]'
      MetricTransformations: [{MetricNamespace: URPOnline/Seguridad, MetricName: ConexionSospechosa, MetricValue: '1', DefaultValue: 0}]
  ConexionSospechosaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-conexion-sospechosa'
      AlarmDescription: Intento de salida a un destino sospechoso (VPC Flow Logs). Dispara la respuesta automatica.
      Namespace: URPOnline/Seguridad
      MetricName: ConexionSospechosa
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SeguridadTopic]
  # Senal del minero: CPU sostenida alta. Solo AVISA (una tormenta de compras tambien sube la CPU).
  CpuAltaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-cpu-alta'
      AlarmDescription: CPU promedio de las EC2 sobre 85 % durante 3 minutos (posible minero o carga extrema).
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: AutoScalingGroupName, Value: !Ref Scaling}]
      Statistic: Average
      Period: 60
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SeguridadTopic]

  # RESPUESTA AUTOMATICA: alarma -> EventBridge -> Lambda que aisla y reemplaza la instancia (fuente legible:
  # infra/respuesta_intrusion.py, con sus pruebas en infra/test_respuesta_intrusion.py).
  RespuestaIntrusionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole']
      Policies:
        - PolicyName: respuesta-intrusion
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['logs:StartQuery'], Resource: !GetAtt FlowLogGroup.Arn}
              - {Effect: Allow, Action: ['logs:GetQueryResults', 'ec2:DescribeNetworkInterfaces', 'ec2:CreateSnapshots', 'ec2:CreateTags', 'ec2:ModifyInstanceAttribute', 'autoscaling:SetInstanceHealth'], Resource: '*'}
              - {Effect: Allow, Action: ['sns:Publish'], Resource: !Ref SeguridadTopic}
  RespuestaIntrusionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-respuesta-intrusion'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RespuestaIntrusionRole.Arn
      Timeout: 120
      Environment:
        Variables: {FLOW_LOGS: !Ref FlowLogGroup, CUARENTENA_SG: !Ref CuarentenaSG, TOPIC: !Ref SeguridadTopic}
      Code:
        ZipFile: |
          # Respuesta AUTOMATICA a una intrusion (fase 2, defensa proactiva). Va embebida en infra/urponline-oneclick.yaml
          # (recurso RespuestaIntrusionLambda); este archivo es la fuente legible y la que prueba infra/test_respuesta_intrusion.py.
          # La dispara la alarma de conexion sospechosa (VPC Flow Logs). Sin intervencion humana:
          #  1) busca en los Flow Logs que interfaz de red intento la conexion y a que instancia pertenece;
          #  2) guarda un snapshot FORENSE de sus discos; 3) la AISLA (security group de cuarentena, sin trafico);
          #  4) la marca no sana para que Auto Scaling la REEMPLACE por una limpia; 5) avisa por SNS.
          import os, time, boto3
          logs = boto3.client('logs'); ec2 = boto3.client('ec2'); asg = boto3.client('autoscaling'); sns = boto3.client('sns')
          CONSULTA = ("fields interfaceId | filter dstPort in [3333,4444,5555,14444,51820] "
                      "or isIpv4InSubnet(dstAddr, '203.0.113.0/24') | stats count() by interfaceId")


          def instancias_sospechosas(minutos=15):
              fin = int(time.time())
              q = logs.start_query(logGroupName=os.environ['FLOW_LOGS'], startTime=fin - minutos * 60, endTime=fin,
                                   queryString=CONSULTA)['queryId']
              r = {}
              for _ in range(30):
                  r = logs.get_query_results(queryId=q)
                  if r['status'] in ('Complete', 'Failed', 'Cancelled', 'Timeout'):
                      break
                  time.sleep(2)
              enis = [c['value'] for fila in r.get('results', []) for c in fila if c['field'] == 'interfaceId']
              if not enis:
                  return []
              nis = ec2.describe_network_interfaces(NetworkInterfaceIds=enis)['NetworkInterfaces']
              return sorted({n['Attachment']['InstanceId'] for n in nis if n.get('Attachment', {}).get('InstanceId')})


          def handler(event, context):
              hechas = []
              for i in instancias_sospechosas():
                  ec2.create_snapshots(InstanceSpecification={'InstanceId': i}, Description='Forense URPOnline ' + i,
                                       TagSpecifications=[{'ResourceType': 'snapshot', 'Tags': [{'Key': 'urponline', 'Value': 'forense'}]}])
                  ec2.modify_instance_attribute(InstanceId=i, Groups=[os.environ['CUARENTENA_SG']])
                  try:
                      asg.set_instance_health(InstanceId=i, HealthStatus='Unhealthy', ShouldRespectGracePeriod=False)
                  except asg.exceptions.ClientError:
                      pass  # la instancia no es del Auto Scaling: queda aislada igual
                  hechas.append(i)
              sns.publish(TopicArn=os.environ['TOPIC'], Subject='URPOnline: respuesta automatica a intrusion',
                          Message='Conexion sospechosa en VPC Flow Logs. Instancias con snapshot forense, en cuarentena y '
                                  'reemplazadas por Auto Scaling: ' + (', '.join(hechas) or 'ninguna encontrada en los Flow Logs'))
              return {'aisladas': hechas}
  RespuestaIntrusionRegla:
    Type: AWS::Events::Rule
    Properties:
      Description: Cuando la alarma de conexion sospechosa pasa a ALARM, ejecuta la respuesta automatica.
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: [CloudWatch Alarm State Change]
        detail:
          alarmName: [!Ref ConexionSospechosaAlarm]
          state: {value: [ALARM]}
      Targets: [{Id: respuesta-intrusion, Arn: !GetAtt RespuestaIntrusionLambda.Arn}]
  RespuestaIntrusionPermiso:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RespuestaIntrusionLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RespuestaIntrusionRegla.Arn

  # AUDITORIA: CloudTrail registra quien hizo que en la cuenta (todas las regiones), con validacion de integridad.
  TrailBucket:
    Type: AWS::S3::Bucket
    # Con registros dentro CloudFormation no puede borrarlo: se conserva al borrar o revertir la pila
    # (el workflow Destruir AWS lo borra despues; vence a los 30 dias).
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      LifecycleConfiguration: {Rules: [{Id: borrar-a-los-30-dias, Status: Enabled, ExpirationInDays: 30}]}
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Sid: CloudTrailAcl, Effect: Allow, Principal: {Service: cloudtrail.amazonaws.com}, Action: 's3:GetBucketAcl', Resource: !GetAtt TrailBucket.Arn}
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: 's3:PutObject'
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition: {StringEquals: {'s3:x-amz-acl': bucket-owner-full-control}}
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub '${AWS::StackName}-auditoria'
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
Outputs:
  TrailBucketName: {Description: 'Bucket de CloudTrail (se conserva al borrar la pila; borrarlo con aws s3 rb --force)', Value: !Ref TrailBucket}
  ALBDNS: {Value: !GetAtt ALB.DNSName}
  DashboardURL: {Description: Telemetría de todos los servicios en una pantalla (CloudWatch), Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/URPOnline-${AWS::StackName}'}
  ApplicationHTTPS: {Description: URL segura de la tienda (CloudFront), Value: !Sub "https://${CDN.DomainName}"}
  ApplicationHTTP: {Value: !Sub "http://${ALB.DNSName}"}
  RDSEndpoint: {Value: !GetAtt Postgres.Endpoint.Address}
  RDSInstanceId: {Description: Identificador del primario (failover y alarmas), Value: !Ref Postgres}
  RDSReplicaEndpoint: {Condition: ConReplica, Description: Replica de lectura (ConnectionStrings__PostgresLectura), Value: !GetAtt ReplicaLectura.Endpoint.Address}
  RDSReplicaId: {Condition: ConReplica, Description: Identificador de la replica (promote-read-replica y alarma de retraso), Value: !Ref ReplicaLectura}
  RedisPrimary: {Value: !GetAtt Redis.PrimaryEndPoint.Address}
  S3SupplierBucket: {Value: !Ref SupplierBucket}
  VpcId: {Value: !Ref VPC}
  # Fase 2: la capa de agentes (infra/fase2-agentes.yaml) pone sus Lambdas en estas subredes y con este SG.
  AppSubnets: {Description: Subredes privadas de aplicacion (AppA y AppB) separadas por coma, Value: !Join [',', [!Ref AppA, !Ref AppB]]}
  AppSecurityGroup: {Description: Security group de la aplicacion (llega a RDS y Redis), Value: !Ref AppSG}
  # Fase 3: EKS se crea DENTRO de esta VPC (k8s/eksctl-cluster.yaml) para llegar a RDS y Redis.
  PublicSubnetA: {Description: Subred publica A (ALB del Ingress de EKS), Value: !Ref PublicA}
  PublicSubnetB: {Description: Subred publica B (ALB del Ingress de EKS), Value: !Ref PublicB}
  AppSubnetA: {Description: Subred privada de aplicacion A (pods de EKS en Fargate), Value: !Ref AppA}
  AppSubnetB: {Description: Subred privada de aplicacion B (pods de EKS en Fargate), Value: !Ref AppB}
  DbSecurityGroup: {Description: Security group de RDS (se le agrega el acceso desde EKS), Value: !Ref DbSG}
  RedisSecurityGroup: {Description: Security group de Redis (se le agrega el acceso desde EKS), Value: !Ref RedisSG}
  DbSecretArn: {Description: Secreto de RDS en Secrets Manager, Value: !Ref DbSecret}
  AccesosSecretArn: {Description: 'Clave de /admin (aws secretsmanager get-secret-value --secret-id ... --query SecretString)', Value: !Ref AccesosSecret}
  DashboardSecretArn: {Description: Clave de /Analytics, Value: !Ref DashboardSecret}
  S3EndpointId: {Description: VPC endpoint de S3 (Gateway), Value: !Ref S3Endpoint}
  DataNaclId: {Description: NACL de la subred de datos, Value: !Ref DataNacl}
  TargetGroupArn: {Value: !Ref TG}
  SeguridadTopicArn: {Description: Alertas de seguridad (intrusion y CPU alta), Value: !Ref SeguridadTopic}
  CuarentenaSecurityGroup: {Description: Security group de cuarentena (sin trafico), Value: !Ref CuarentenaSG}
  RespuestaIntrusionFunction: {Description: Lambda de respuesta automatica a intrusion, Value: !Ref RespuestaIntrusionLambda}
  TrailName: {Description: CloudTrail de auditoria, Value: !Ref Trail}

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Fase 2 - URPOnline Delivery (base del curso, solo el camino feliz). Aditivo a la pila base (urponline-oneclick)
  y a la capa de agentes (fase2-agentes): Cognito, API Gateway REST generada desde el contrato OpenAPI
  (contratos/delivery-v1.openapi.yaml), API Gateway WebSocket, colas SQS (estandar, con retraso y FIFO) con DLQ,
  Lambdas .NET 8, RDS Proxy, Amazon Location Service, EventBridge y alarmas.
  Se despliega con --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND (AWS::Include del contrato).

Parameters:
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subredes privadas de la app (Output AppSubnets de la pila base) para las Lambdas y el RDS Proxy.
  AppSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: SG de la aplicacion (Output AppSecurityGroup de la pila base); ya llega a RDS por 5432.
  DbSecretArn:
    Type: String
    Description: ARN del secreto de RDS (Output DbSecretArn de la pila base). Tiene username y password.
  DbHost:
    Type: String
    Description: Endpoint de RDS (Output RDSEndpoint de la pila base). Las Lambdas se conectan aqui si no hay RDS Proxy.
  UsarRdsProxy:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      RDS Proxy reparte pocas conexiones reales entre muchas Lambdas. NO esta disponible en las cuentas del plan
      gratuito de AWS («This feature isn't available with free plan accounts»): por eso viene apagado.
  DbInstanceId:
    Type: String
    Description: Identificador de la instancia RDS (aws rds describe-db-instances --query 'DBInstances[0].DBInstanceIdentifier').
  TiendaUrl:
    Type: String
    # Se usa dentro del contrato (AWS::Include): cfn-lint no lo ve y avisa W2001.
    Description: URL de la tienda (Output ApplicationHTTP de la pila base); atiende la busqueda, las cartas y el soporte.
  ContratoS3Uri:
    Type: String
    Description: s3://bucket/contratos/delivery-v1.openapi.yaml (el workflow lo sube antes de desplegar).
  RedisHost:
    Type: String
    Description: Endpoint de ElastiCache Redis (Output RedisPrimary de la pila base); guarda la ultima posicion y el GEO de repartidores.
  EventBusName:
    Type: String
    Description: Bus de EventBridge de la tienda (Output BusName de la pila fase2-agentes).
  LambdaCodeBucket:
    Type: String
    Description: Bucket S3 con el ZIP de las Lambdas del delivery (.NET 8).
  LambdaCodeKey:
    Type: String
    Default: delivery/delivery.zip
  AlertEmail:
    Type: String
    Description: Correo que recibe las alarmas del delivery (DLQ con mensajes).

Conditions:
  ConProxy: !Equals [!Ref UsarRdsProxy, 'true']

Resources:

  # ---------- Cognito: quien es cada usuario y a que grupo pertenece ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'urponline-delivery-${AWS::StackName}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireNumbers: true, RequireLowercase: true, RequireUppercase: true }

  GrupoRepartidor:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: repartidor, Description: Repartidores en moto }

  GrupoCliente:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: cliente, Description: Clientes que piden comida }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: urponline-delivery-apps
      GenerateSecret: false              # apps publicas (React Native): sin secreto
      # Las apps usan SRP (la contrasena no viaja). USER_PASSWORD_AUTH solo para sacar un token con la CLI y probar con curl.
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # ---------- SQS: cada cola con su DLQ ----------
  PedidosRecibidosDLQ:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'delivery-pedidos-recibidos-dlq-${AWS::StackName}', MessageRetentionPeriod: 1209600 }
  PedidosRecibidosQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'delivery-pedidos-recibidos-${AWS::StackName}'
      VisibilityTimeout: 180             # 6 veces el Timeout de la Lambda que la consume
      RedrivePolicy: { deadLetterTargetArn: !GetAtt PedidosRecibidosDLQ.Arn, maxReceiveCount: 3 }

  PedidosReofrecerDLQ:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'delivery-pedidos-reofrecer-dlq-${AWS::StackName}', MessageRetentionPeriod: 1209600 }
  PedidosReofrecerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'delivery-pedidos-reofrecer-${AWS::StackName}'
      VisibilityTimeout: 180             # el retraso lo pone cada mensaje (DelaySeconds)
      RedrivePolicy: { deadLetterTargetArn: !GetAtt PedidosReofrecerDLQ.Arn, maxReceiveCount: 3 }

  CambiosEntregaDLQ:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'delivery-cambios-entrega-dlq-${AWS::StackName}.fifo', FifoQueue: true, MessageRetentionPeriod: 1209600 }
  CambiosEntregaQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'delivery-cambios-entrega-${AWS::StackName}.fifo'
      FifoQueue: true                    # orden por pedido (MessageGroupId = pedidoId)
      VisibilityTimeout: 180
      RedrivePolicy: { deadLetterTargetArn: !GetAtt CambiosEntregaDLQ.Arn, maxReceiveCount: 3 }

  PosicionesDLQ:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'delivery-posiciones-dlq-${AWS::StackName}.fifo', FifoQueue: true, MessageRetentionPeriod: 86400 }
  PosicionesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'delivery-posiciones-${AWS::StackName}.fifo'
      FifoQueue: true                    # orden por repartidor (MessageGroupId = sub de Cognito)
      VisibilityTimeout: 180
      RedrivePolicy: { deadLetterTargetArn: !GetAtt PosicionesDLQ.Arn, maxReceiveCount: 3 }

  # API Gateway escribe las posiciones directo en la cola FIFO (sin Lambda en la entrada).
  ApiSqsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: apigateway.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: enviar-posiciones
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{ Effect: Allow, Action: 'sqs:SendMessage', Resource: !GetAtt PosicionesQueue.Arn }]

  # ---------- RDS Proxy: las Lambdas se conectan solo por aqui ----------
  # Comparte el SG de la app: la regla de abajo deja que el SG hable consigo mismo por 5432 (Lambda -> proxy).
  AppIngresoProxy:
    Condition: ConProxy
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref AppSecurityGroupId, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroupId, Description: Lambdas del delivery hacia el RDS Proxy }
  AppEgresoProxy:
    Condition: ConProxy
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AppSecurityGroupId, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref AppSecurityGroupId, Description: Lambdas del delivery hacia el RDS Proxy }

  ProxyRole:
    Condition: ConProxy
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: rds.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: leer-secreto-db
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{ Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref DbSecretArn }]

  DbProxy:
    Condition: ConProxy
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub 'urponline-delivery-${AWS::StackName}'
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt ProxyRole.Arn
      Auth: [{ AuthScheme: SECRETS, SecretArn: !Ref DbSecretArn, IAMAuth: DISABLED }]
      RequireTLS: true
      VpcSubnetIds: !Ref PrivateSubnetIds
      VpcSecurityGroupIds: [!Ref AppSecurityGroupId]

  DbProxyTargets:
    Condition: ConProxy
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref DbProxy
      TargetGroupName: default
      DBInstanceIdentifiers: [!Ref DbInstanceId]

  # ---------- Logs y alertas ----------
  DeliveryLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/urponline/delivery/${AWS::StackName}', RetentionInDays: 7 }

  AlertasTopic:
    Type: AWS::SNS::Topic
    Properties: { TopicName: !Sub 'urponline-delivery-alertas-${AWS::StackName}' }
  AlertasSub:
    Type: AWS::SNS::Subscription
    Properties: { TopicArn: !Ref AlertasTopic, Protocol: email, Endpoint: !Ref AlertEmail }

  # ---------- Rol de las Lambdas: MINIMO PRIVILEGIO ----------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: 'sts:AssumeRole' }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: delivery-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['sqs:SendMessage', 'sqs:ReceiveMessage', 'sqs:DeleteMessage', 'sqs:GetQueueAttributes']
                Resource:
                  - !GetAtt PedidosRecibidosQueue.Arn
                  - !GetAtt PedidosReofrecerQueue.Arn
                  - !GetAtt CambiosEntregaQueue.Arn
                  - !GetAtt PosicionesQueue.Arn
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue']
                Resource: !Ref DbSecretArn
              - Effect: Allow
                Action: ['events:PutEvents']
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}'
              - Effect: Allow
                Action: ['execute-api:ManageConnections']
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'
              - Effect: Allow
                Action: ['cloudwatch:PutMetricData']
                Resource: '*'
                Condition: { StringEquals: { 'cloudwatch:namespace': 'URPOnline/Delivery' } }

  # ---------- Lambdas (un solo ZIP, un punto de entrada por funcion) ----------
  RecibirPedidoFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'delivery-recibir-pedido-${AWS::StackName}'
      Runtime: dotnet8
      Handler: URPOnline.Delivery::URPOnline.Delivery.Funciones::RecibirPedido
      Role: !GetAtt LambdaRole.Arn
      Timeout: 15
      MemorySize: 512
      Code: { S3Bucket: !Ref LambdaCodeBucket, S3Key: !Ref LambdaCodeKey }
      VpcConfig: { SecurityGroupIds: [!Ref AppSecurityGroupId], SubnetIds: !Ref PrivateSubnetIds }
      TracingConfig: { Mode: Active }
      LoggingConfig: { LogGroup: !Ref DeliveryLogs, LogFormat: JSON }
      Environment:
        Variables:
          ConnectionStrings__Postgres: !If
            - ConProxy
            - !Sub 'Host=${DbProxy.Endpoint};Port=5432;Database=urponline;Username=urponline;SSL Mode=Require;Trust Server Certificate=true'
            - !Sub 'Host=${DbHost};Port=5432;Database=urponline;Username=urponline;SSL Mode=Require;Trust Server Certificate=true'
          Database__SecretArn: !Ref DbSecretArn
          Colas__PedidosRecibidos: !Ref PedidosRecibidosQueue
          Colas__PedidosReofrecer: !Ref PedidosReofrecerQueue
          Colas__CambiosEntrega: !Ref CambiosEntregaQueue
          Colas__Posiciones: !Ref PosicionesQueue
          Eventos__Bus: !Ref EventBusName
          WebSocket__Endpoint: !Sub 'https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
          Cognito__UserPoolId: !Ref UserPool
          Cognito__ClientId: !Ref UserPoolClient
          Redis__Host: !Ref RedisHost


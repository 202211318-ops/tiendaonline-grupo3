      TracingConfig: { Mode: Active }
      LoggingConfig: { LogGroup: !Ref DeliveryLogs, LogFormat: JSON }
      Environment:
        Variables:
          ConnectionStrings__Postgres: !If
            - ConProxy
            - !Sub 'Host=${DbProxy.Endpoint};Port=5432;Database=urponline;Username=urponline;SSL Mode=Require;Trust Server Certificate=true'
            - !Sub 'Host=${DbHost};Port=5432;Database=urponline;Username=urponline;SSL Mode=Require;Trust Server Certificate=true'
          Database__SecretArn: !Ref DbSecretArn
          Colas__PedidosRecibidos: !Ref PedidosRecibidosQueue
          Colas__PedidosReofrecer: !Ref PedidosReofrecerQueue
          Colas__CambiosEntrega: !Ref CambiosEntregaQueue
          Colas__Posiciones: !Ref PosicionesQueue
          Eventos__Bus: !Ref EventBusName
          WebSocket__Endpoint: !Sub 'https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
          Cognito__UserPoolId: !Ref UserPool
          Cognito__ClientId: !Ref UserPoolClient
          Redis__Host: !Ref RedisHost

  # SQS -> Lambda, por lotes y con REPORTE DE FALLAS PARCIALES.
  RecibidosSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties: { EventSourceArn: !GetAtt PedidosRecibidosQueue.Arn, FunctionName: !Ref OfrecerPedidoFn, BatchSize: 10, MaximumBatchingWindowInSeconds: 1, FunctionResponseTypes: [ReportBatchItemFailures] }
  ReofrecerSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties: { EventSourceArn: !GetAtt PedidosReofrecerQueue.Arn, FunctionName: !Ref ReofrecerPedidoFn, BatchSize: 10, FunctionResponseTypes: [ReportBatchItemFailures] }
  CambiosSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties: { EventSourceArn: !GetAtt CambiosEntregaQueue.Arn, FunctionName: !Ref ActualizarEntregaFn, BatchSize: 10, FunctionResponseTypes: [ReportBatchItemFailures] }
  PosicionesSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties: { EventSourceArn: !GetAtt PosicionesQueue.Arn, FunctionName: !Ref RegistrarPosicionFn, BatchSize: 10, FunctionResponseTypes: [ReportBatchItemFailures] }

  # ---------- API Gateway REST: generada desde el contrato ----------
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'urponline-delivery-${AWS::StackName}'
      EndpointConfiguration: { Types: [REGIONAL] }
      ApiKeySourceType: HEADER
      Body:
        'Fn::Transform':
          Name: AWS::Include
          Parameters: { Location: !Ref ContratoS3Uri }

  # Si cambia el contrato, cambia el nombre logico de este recurso para publicar una version nueva.
  RestDeploymentV1:
    Type: AWS::ApiGateway::Deployment
    Properties: { RestApiId: !Ref RestApi }

  RestStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref RestDeploymentV1
      StageName: prod
      TracingEnabled: true
      MethodSettings:
        - { ResourcePath: '/*', HttpMethod: '*', MetricsEnabled: true, ThrottlingRateLimit: 100, ThrottlingBurstLimit: 200 }

  # Base: UN plan y UNA clave compartida. Los cuatro consumidores con su plan y su limite son el desafio C2.
  PlanBase:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub 'delivery-base-${AWS::StackName}'
      ApiStages: [{ ApiId: !Ref RestApi, Stage: !Ref RestStage }]
      Throttle: { RateLimit: 50, BurstLimit: 100 }
  ClaveBase:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: RestStage
    Properties: { Name: !Sub 'delivery-base-${AWS::StackName}', Enabled: true }
  ClaveEnPlan:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties: { KeyId: !Ref ClaveBase, KeyType: API_KEY, UsagePlanId: !Ref PlanBase }

  PermisoApiRecibir:
    Type: AWS::Lambda::Permission
    Properties: { Action: 'lambda:InvokeFunction', FunctionName: !Ref RecibirPedidoFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*' }
  PermisoApiConsultas:
    Type: AWS::Lambda::Permission
    Properties: { Action: 'lambda:InvokeFunction', FunctionName: !Ref ConsultasFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*' }
  PermisoApiAceptar:
    Type: AWS::Lambda::Permission
    Properties: { Action: 'lambda:InvokeFunction', FunctionName: !Ref AceptarPedidoFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*' }
  PermisoApiSincronizar:
    Type: AWS::Lambda::Permission
    Properties: { Action: 'lambda:InvokeFunction', FunctionName: !Ref SincronizarFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*' }

  # ---------- API Gateway WebSocket: la posicion llega al mapa del cliente ----------
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'urponline-delivery-ws-${AWS::StackName}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WsIntegracion:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ConexionWsFn.Arn}/invocations'

  WsRutaConectar:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: '$connect', Target: !Sub 'integrations/${WsIntegracion}' }
  WsRutaDesconectar:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: '$disconnect', Target: !Sub 'integrations/${WsIntegracion}' }
  WsRutaSeguir:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WsApi, RouteKey: seguir, Target: !Sub 'integrations/${WsIntegracion}' }

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: { ApiId: !Ref WsApi, StageName: prod, AutoDeploy: true }

  PermisoWs:
    Type: AWS::Lambda::Permission
    Properties: { Action: 'lambda:InvokeFunction', FunctionName: !Ref ConexionWsFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*' }

  # ---------- EventBridge: los eventos del delivery quedan registrados ----------
  EventosLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/events/urponline-delivery-${AWS::StackName}', RetentionInDays: 7 }

  EventosLogsPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub 'delivery-eventos-${AWS::StackName}'
      PolicyDocument: !Sub '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["events.amazonaws.com","delivery.logs.amazonaws.com"]},"Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"${EventosLogs.Arn}"}]}'

  ReglaEventosDelivery:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBusName
      Description: Eventos del delivery hacia un grupo de logs (linea de tiempo de cada pedido).
      EventPattern:
        source: ['urponline.delivery']
        detail-type: [PedidoRecibido, PedidoAceptado, PedidoEntregado]
      Targets:
        - { Id: eventos-logs, Arn: !GetAtt EventosLogs.Arn }

  # ---------- Amazon Location Service: el mapa de la app cliente y de la torre de control ----------
  Mapa:
    Type: AWS::Location::Map
    Properties:
      MapName: !Sub 'urponline-delivery-${AWS::StackName}'
      Configuration: { Style: VectorEsriStreets }

  MapaApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub 'urponline-delivery-mapa-${AWS::StackName}'
      NoExpiry: true
      Restrictions:
        AllowActions: ['geo:GetMap*']
        AllowResources: [!GetAtt Mapa.Arn]

  # ---------- Alarmas: una DLQ con mensajes avisa por correo ----------
  AlarmaDlqRecibidos:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'delivery-dlq-pedidos-recibidos-${AWS::StackName}'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt PedidosRecibidosDLQ.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]
  AlarmaDlqCambios:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'delivery-dlq-cambios-entrega-${AWS::StackName}'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt CambiosEntregaDLQ.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]

Outputs:
  ApiUrl:
    Description: URL de la API del delivery (las apps le agregan /v1/...).
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ApiKeyId:
    Description: 'Clave base; su valor: aws apigateway get-api-key --api-key <id> --include-value --query value --output text'
    Value: !Ref ClaveBase
  WebSocketUrl:
    Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ProxyEndpoint:
    Condition: ConProxy
    Value: !GetAtt DbProxy.Endpoint
  MapName:
    Value: !Ref Mapa
  MapaApiKeyName:
    Description: 'Valor de la key: aws location describe-key --key-name <nombre> --query Key --output text'
    Value: !Ref MapaApiKey
  SimuladorFunction:
    Value: !Ref SimuladorFn
  AlertasTopicArn:
    Value: !Ref AlertasTopic

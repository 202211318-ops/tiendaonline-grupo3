# Fase 3 - Despliegue en EKS (Kubernetes) SOBRE Fargate, con BLUE/GREEN y reversion automatica.
# EKS orquesta; Fargate es el compute (no hay nodos EC2 que gestionar). El Fargate profile que
# selecciona este namespace se crea en k8s/eksctl-cluster.yaml.
# Blue/green: Argo Rollouts (instalado en el paso 3 del README) levanta cada version nueva detras del
# Service 'urponline-preview', la ataca con k6 (k8s/bluegreen-analisis.yaml) y solo entonces le pasa el
# trafico del Service 'urponline' (el del Ingress/ALB). Tras el cambio la vuelve a probar: si falla,
# el trafico vuelve SOLO a la version anterior, que se mantiene encendida scaleDownDelaySeconds.
# Reemplaza antes de aplicar (Outputs de las pilas URPOnlineLab y urponline-fase3):
#   226225708455.dkr.ecr.us-east-2.amazonaws.com/urponline:v1      imagen de tu ECR, p. ej. 123456789012.dkr.ecr.us-east-2.amazonaws.com/urponline:v1
#   urponlinelab-postgres-iv6tg6lmlu0c.clyuuuymuua9.us-east-2.rds.amazonaws.com   Output RDSEndpoint        master.urr16ihni1kfhn7j.1gy42v.use2.cache.amazonaws.com  Output RedisPrimary
#   urponlinelab-postgres-iv6tg6lmlu0c.clyuuuymuua9.us-east-2.rds.amazonaws.com  Output RDSReplicaEndpoint (pila con EnableReadReplica=true). Sin replica,
#                    pon ahi el mismo urponlinelab-postgres-iv6tg6lmlu0c.clyuuuymuua9.us-east-2.rds.amazonaws.com: el catalogo lee del primario.
#   arn:aws:secretsmanager:us-east-2:226225708455:secret:URPOnlineLab/rds-postgres-2xjnWF  Output DbSecretArn        subnet-0462a0e35c71e7d39,subnet-031cd405a832147c8  Outputs PublicSubnetA/B
# Sin contrasenas aqui: la de RDS la lee la app de Secrets Manager con el rol IAM del ServiceAccount
# 'urponline' (IRSA, creado por eksctl), igual que en las EC2.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: urponline-config
  namespace: urponline
data:
  ConnectionStrings__Postgres: "Host=urponlinelab-postgres-iv6tg6lmlu0c.clyuuuymuua9.us-east-2.rds.amazonaws.com;Port=5432;Database=urponline;Username=urponline;SSL Mode=Require;Trust Server Certificate=true"
  # B3: el catalogo y la busqueda leen de la replica (ShopReadDbContext); pedidos y pagos escriben en el primario.
  ConnectionStrings__PostgresLectura: "Host=urponlinelab-postgres-iv6tg6lmlu0c.clyuuuymuua9.us-east-2.rds.amazonaws.com;Port=5432;Database=urponline;Username=urponline;SSL Mode=Require;Trust Server Certificate=true"
  ConnectionStrings__Redis: "master.urr16ihni1kfhn7j.1gy42v.use2.cache.amazonaws.com:6379,ssl=true,abortConnect=false"
  Database__SecretArn: "arn:aws:secretsmanager:us-east-2:226225708455:secret:URPOnlineLab/rds-postgres-2xjnWF"
  AWS__Region: "us-east-2"
  Metrics__CloudWatchEnabled: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: urponline
  namespace: urponline
  labels: { app: urponline }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300            # si la version nueva no esta lista en 5 min (p. ej. no arranca)...
  progressDeadlineAbort: true             # ...se aborta sola y el trafico sigue en la anterior
  strategy:
    blueGreen:
      activeService: urponline            # el que recibe el trafico del ALB
      previewService: urponline-preview   # la version nueva, todavia sin trafico
      autoPromotionEnabled: true          # se promueve sola si la prueba previa pasa
      prePromotionAnalysis:               # ANTES del cambio: carga contra la version nueva
        templates: [{ templateName: prueba-carga }]
        args: [{ name: url, value: "http://urponline-preview.urponline.svc.cluster.local" }]
      postPromotionAnalysis:              # DESPUES del cambio: carga contra la version activa
        templates: [{ templateName: prueba-carga }]
        args: [{ name: url, value: "http://urponline.urponline.svc.cluster.local" }]
      scaleDownDelaySeconds: 300          # la version anterior sigue encendida 5 min para volver al instante
  selector:
    matchLabels: { app: urponline }
  template:
    metadata:
      labels: { app: urponline }
    spec:
      serviceAccountName: urponline        # rol IAM (IRSA): Secrets Manager + CloudWatch
      # B1/B4: un pod por zona como minimo, para que caiga una zona y no se lleve toda la web.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: urponline } }
      # B4: al borrar un pod, primero el ALB deja de mandarle trafico (preStop) y despues termina lo que tenia en curso.
      terminationGracePeriodSeconds: 45
      containers:
        - name: urponline
          image: 226225708455.dkr.ecr.us-east-2.amazonaws.com/urponline:v1
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          envFrom:
            - configMapRef: { name: urponline-config }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          lifecycle:
            preStop:
              exec: { command: ["sleep", "15"] }   # tiempo para que el ALB saque el pod de su target group
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
# B4: durante una caida o un cambio de version, nunca quedan menos de 1 pod web disponible.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: urponline
  namespace: urponline
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: urponline }
---
apiVersion: v1
kind: Service
metadata:
  name: urponline
  namespace: urponline
spec:
  selector: { app: urponline }
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
# Service de PREVIEW: Argo Rollouts lo apunta a la version nueva mientras se prueba.
apiVersion: v1
kind: Service
metadata:
  name: urponline-preview
  namespace: urponline
spec:
  selector: { app: urponline }
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
# Ingress con el AWS Load Balancer Controller (crea un ALB publico en las subredes publicas de la VPC).
# Requiere el controller instalado (ver README, paso "EKS sobre Fargate").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urponline
  namespace: urponline
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/subnets: subnet-0462a0e35c71e7d39,subnet-031cd405a832147c8
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"   # B4: detecta antes un pod caido
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # D1: el WAF (Output WebAclArn de infra/fase3-seguridad.yaml) queda delante de este ALB.
    # Mientras no crees esa pila, borra esta linea: con el texto <WAF_ACL_ARN> el ALB no se crea.
    # alb.ingress.kubernetes.io/wafv2-acl-arn: <WAF_ACL_ARN>
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # B2: la API va a la capa de negocio (k8s/api-pedidos.yaml), con su propio Service y sus replicas.
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api-pedidos
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urponline
                port: { number: 80 }
---
# Autoescalado de pods por CPU (HPA) sobre el Rollout.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urponline
  namespace: urponline
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: urponline
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }

# Fase 3 - Despliegue en EKS (Kubernetes) SOBRE Fargate.
# EKS orquesta; Fargate es el compute (no hay nodos EC2 que gestionar). El Fargate profile que
# selecciona este namespace se crea en infra/fase3-contenedores.yaml.
# Reemplaza <ECR_IMAGE> por la imagen de tu ECR (p. ej. 123456789.dkr.ecr.us-east-1.amazonaws.com/urponline:TAG).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urponline
  namespace: urponline
  labels: { app: urponline }
spec:
  replicas: 2
  selector:
    matchLabels: { app: urponline }
  template:
    metadata:
      labels: { app: urponline }
    spec:
      containers:
        - name: urponline
          image: <ECR_IMAGE>
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # La cadena de conexion y los secretos vienen de ConfigMap/Secret (o Secrets Manager + CSI).
            - name: ConnectionStrings__Postgres
              valueFrom: { secretKeyRef: { name: urponline-secrets, key: postgres } }
            - name: ConnectionStrings__Redis
              valueFrom: { secretKeyRef: { name: urponline-secrets, key: redis } }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: urponline
  namespace: urponline
spec:
  selector: { app: urponline }
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
# Ingress con el AWS Load Balancer Controller (crea un ALB). Requiere el controller instalado.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urponline
  namespace: urponline
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urponline
                port: { number: 80 }
---
# Autoescalado de pods por CPU (HPA).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urponline
  namespace: urponline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urponline
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }

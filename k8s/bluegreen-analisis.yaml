# Fase 3 - Prueba automatica del blue/green (Argo Rollouts). La usa el Rollout de k8s/deployment.yaml:
#   - antes del cambio, contra la version nueva (Service urponline-preview);
#   - despues del cambio, contra la version activa (Service urponline).
# Es una prueba de carga con k6 dentro del cluster: 10 usuarios durante 1 minuto sobre /health y la API.
# Si hay mas de 1 % de errores o el p95 pasa de 2 s, k6 termina con error, el analisis falla y Argo
# Rollouts deja (o devuelve) el trafico en la version anterior.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prueba-bluegreen
  namespace: urponline
data:
  prueba.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    const BASE = __ENV.BASE_URL;
    export const options = {
      vus: 10, duration: '60s',
      thresholds: { http_req_failed: ['rate<0.01'], http_req_duration: ['p(95)<2000'] },
    };
    export default function () {
      check(http.get(`${BASE}/health`), { 'health 200': (r) => r.status === 200 });
      check(http.get(`${BASE}/api/v1/products`), { 'catalogo 200': (r) => r.status === 200 });
      sleep(1);
    }
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prueba-carga
  namespace: urponline
spec:
  args:
    - name: url
  metrics:
    - name: errores-bajo-carga
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: k6
                    image: grafana/k6:0.54.0
                    args: ["run", "--quiet", "-e", "BASE_URL={{args.url}}", "/scripts/prueba.js"]
                    volumeMounts: [{ name: scripts, mountPath: /scripts }]
                    resources:
                      requests: { cpu: "250m", memory: "256Mi" }
                volumes:
                  - name: scripts
                    configMap: { name: prueba-bluegreen }

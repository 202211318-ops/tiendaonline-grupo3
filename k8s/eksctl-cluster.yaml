# Fase 3 - Clúster EKS SOBRE Fargate, con eksctl, DENTRO de la VPC de la tienda (pila URPOnlineLab).
# EKS orquesta (Kubernetes); Fargate es el compute (sin nodos EC2 que gestionar).
# Los pods corren en las subredes privadas de aplicacion (las mismas de las EC2): asi llegan a RDS y a
# Redis, que solo aceptan trafico desde esas subredes (NACL de datos) y desde sus security groups.
#
# Antes de crear, reemplaza con los Outputs de la pila URPOnlineLab:
#   vpc-0f3f46e343a6e6293  subnet-0462a0e35c71e7d39  subnet-031cd405a832147c8  subnet-084e50ffe52e13599  subnet-0fe106c54b1d6a876  arn:aws:secretsmanager:us-east-2:226225708455:secret:URPOnlineLab/rds-postgres-2xjnWF  <SUPPLIER_BUCKET>
# Crea:   eksctl create cluster -f k8s/eksctl-cluster.yaml
# Borra:  eksctl delete cluster -f k8s/eksctl-cluster.yaml   (EKS cobra el clúster por hora: bórralo al terminar)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: urponline
  region: us-east-2   # Ohio: la misma region del resto del curso (tienda, ECR)
  # Version con soporte estandar. Comprueba las vigentes con: aws eks describe-cluster-versions
  version: "1.35"

vpc:
  id: vpc-0f3f46e343a6e6293
  subnets:
    public:
      public-a: { id: subnet-0462a0e35c71e7d39 }
      public-b: { id: subnet-031cd405a832147c8 }
    private:
      app-a: { id: subnet-084e50ffe52e13599 }
      app-b: { id: subnet-0fe106c54b1d6a876 }

# Todo el namespace urponline (y los componentes de kube-system) corre en Fargate, en las subredes privadas.
fargateProfiles:
  - name: urponline-fp
    subnets: [subnet-084e50ffe52e13599, subnet-0fe106c54b1d6a876]       # IDs reales: eksctl no acepta aqui los alias app-a/app-b de vpc.subnets
    selectors:
      - namespace: urponline
      - namespace: urponline-cl        # Chile (A5, k8s/paises.yaml)
      - namespace: kube-system
      - namespace: argo-rollouts        # el controlador del blue/green (Argo Rollouts)

# OIDC para que los pods usen roles IAM (IRSA): sin Access Keys en ningun pod.
iam:
  withOIDC: true
  serviceAccounts:
    # La tienda: lee la contrasena de RDS de Secrets Manager (igual que en las EC2) y publica sus metricas.
    - metadata: { name: urponline, namespace: urponline }
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: "arn:aws:secretsmanager:us-east-2:226225708455:secret:URPOnlineLab/rds-postgres-2xjnWF"
          - Effect: Allow
            Action: [cloudwatch:PutMetricData]
            Resource: "*"
            Condition: { StringEquals: { "cloudwatch:namespace": URPOnline } }
    # La misma tienda en nodos EC2 (comparacion Fargate vs. EC2, README paso 8): mismo permiso.
    - metadata: { name: urponline, namespace: urponline-ec2 }
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: "arn:aws:secretsmanager:us-east-2:226225708455:secret:URPOnlineLab/rds-postgres-2xjnWF"
          - Effect: Allow
            Action: [cloudwatch:PutMetricData]
            Resource: "*"
            Condition: { StringEquals: { "cloudwatch:namespace": URPOnline } }
    # La tienda de Chile (A5): mismo permiso que la de Peru.
    - metadata: { name: urponline, namespace: urponline-cl }
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: "arn:aws:secretsmanager:us-east-2:226225708455:secret:URPOnlineLab/rds-postgres-2xjnWF"
          - Effect: Allow
            Action: [cloudwatch:PutMetricData]
            Resource: "*"
            Condition: { StringEquals: { "cloudwatch:namespace": URPOnline } }
    # El importador de proveedores (F1, k8s/proveedores-cronjob.yaml): lee el CSV del bucket y el secreto de RDS.
    - metadata: { name: proveedores, namespace: urponline }
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:GetObject]
            Resource: "arn:aws:s3:::<SUPPLIER_BUCKET>/suppliers/*"
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: "arn:aws:secretsmanager:us-east-2:226225708455:secret:URPOnlineLab/rds-postgres-2xjnWF"
    # El AWS Load Balancer Controller: crea el ALB a partir del Ingress (k8s/deployment.yaml).
    - metadata: { name: aws-load-balancer-controller, namespace: kube-system }
      wellKnownPolicies:
        awsLoadBalancerController: true
    # El CronJob de prediccion (k8s/prediccion.yaml).
    - metadata: { name: predictor, namespace: urponline }
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [cloudwatch:GetMetricStatistics]
            Resource: "*"
          - Effect: Allow
            Action: [cloudwatch:PutMetricData]
            Resource: "*"
            Condition: { StringEquals: { "cloudwatch:namespace": URPOnline } }
          - Effect: Allow
            Action: [sns:Publish]
            Resource: "arn:aws:sns:*:*:urponline-alertas"
          - Effect: Allow
            Action: [s3:GetObject]
            Resource: "arn:aws:s3:::urponline-modelos-*/*"

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
